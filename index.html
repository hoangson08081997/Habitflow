<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HabitFlow" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234f46e5'/%3E%3Cstop offset='100%25' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='42' fill='url(%23g)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-weight='800' font-size='76' letter-spacing='-3'%3EHF%3C/text%3E%3C/svg%3E" />
  <title>HabitFlow - Theo dõi thói quen hằng ngày</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <style>
    :root {
      --ease-ios: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    [x-cloak] { display: none !important; }
    * { -webkit-tap-highlight-color: transparent; }
    button:focus, button:focus-visible { outline: none !important; }
    .ios-header { padding-top: max(1.25rem, env(safe-area-inset-top)); }
    .ios-bottom-nav { padding-bottom: max(0.75rem, env(safe-area-inset-bottom)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .habit-card-touch { touch-action: pan-y; }

    /* ================= NATIVE iOS 60FPS ANIMATIONS ================= */
    .ios-spring-btn {
      transition: transform 0.28s var(--ease-spring), opacity 0.2s ease;
      will-change: transform;
    }
    .ios-spring-btn:active {
      transform: scale(0.92);
      transition: transform 0.08s var(--ease-ios);
    }

    @keyframes floatStepPop {
      0% { opacity: 0; transform: translateY(4px) scale(0.75); }
      22% { opacity: 1; transform: translateY(-8px) scale(1.08); }
      100% { opacity: 0; transform: translateY(-28px) scale(0.96); }
    }
    .animate-float-pop {
      animation: floatStepPop 550ms var(--ease-ios) forwards;
      pointer-events: none;
      will-change: transform, opacity;
    }

    @keyframes completionCardPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      40% { transform: scale(1.014); box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .animate-completion-pulse {
      animation: completionCardPulse 560ms var(--ease-spring);
    }

    @keyframes checkPopIn {
      0% { transform: scale(0.45); opacity: 0; }
      65% { transform: scale(1.22); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-check-pop {
      display: inline-block;
      animation: checkPopIn 380ms var(--ease-spring);
    }

    @keyframes barGrowUp {
      0% { transform: scaleY(0); opacity: 0.25; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    .animate-bar-rise {
      transform-origin: bottom;
      animation: barGrowUp 520ms var(--ease-ios) backwards;
      will-change: transform;
    }

    .ios-svg-ring { transition: stroke-dashoffset 0.5s var(--ease-ios); }
    .ios-progress-bar { transition: width 0.48s var(--ease-ios); }

    .ios-accordion-grid {
      display: grid;
      grid-template-rows: 1fr;
      opacity: 1;
      transition: grid-template-rows 0.32s var(--ease-ios), opacity 0.24s var(--ease-ios);
    }
    .ios-accordion-grid.is-collapsed { grid-template-rows: 0fr; opacity: 0; }
    .ios-accordion-inner { overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .ios-spring-btn, .ios-svg-ring, .ios-progress-bar, .ios-accordion-grid,
      .animate-float-pop, .animate-completion-pulse, .animate-check-pop, .animate-bar-rise {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white overflow-hidden">
  <div x-data="habitFlowApp()" x-init="init()" :class="darkMode ? 'dark' : ''" class="w-full h-[100dvh] flex items-center justify-center bg-slate-200 dark:bg-slate-950">
    <!-- Khung iPhone 14 Plus 428x926px trên Desktop & 100dvh trên Mobile -->
    <div class="w-full h-[100dvh] sm:w-[428px] sm:h-[926px] sm:max-h-[96dvh] sm:rounded-[44px] sm:shadow-2xl sm:border-[6px] sm:border-slate-800 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 flex flex-col overflow-hidden relative transition-colors duration-200">

      <!-- FLOATING TOAST + NÚT HOÀN TÁC Ở VÙNG NGÓN CÁI (bottom-24 left-3.5 right-3.5) -->
      <div x-show="toast.visible" x-cloak
           x-transition:enter="transition ease-out duration-200"
           x-transition:enter-start="opacity-0 translate-y-3"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-150"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 translate-y-3"
           class="absolute bottom-24 left-3.5 right-3.5 z-50 flex justify-center">
        <div :class="toast.tone === 'error'
              ? 'bg-rose-600/95 text-white border-rose-500'
              : (toast.tone === 'success'
                ? 'bg-slate-900/95 dark:bg-slate-100/95 text-white dark:text-slate-900 border-emerald-500/40'
                : 'bg-slate-900/95 dark:bg-slate-100/95 text-white dark:text-slate-900 border-slate-700/50 dark:border-slate-300')"
             class="w-full max-w-[392px] px-3.5 py-2.5 rounded-2xl shadow-xl backdrop-blur-md flex items-center justify-between gap-2.5 border">
          <span class="text-xs font-bold leading-snug flex-1" x-text="toast.message"></span>
          <button x-show="toast.undo !== null"
                  @click="undoLastAction()"
                  class="ios-spring-btn shrink-0 px-2.5 py-1.5 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white text-[11px] font-extrabold">
            ↺ Hoàn tác
          </button>
        </div>
      </div>

      <!-- ================= MÀN HÌNH KHÓA PRIVATE (!session) ================= -->
      <div x-show="!session" x-cloak
           class="flex-1 flex flex-col items-center justify-center px-7 text-center select-none ios-header ios-bottom-nav">
        <div class="w-20 h-20 rounded-[26px] bg-gradient-to-br from-indigo-600 to-violet-600 text-white flex items-center justify-center font-extrabold text-3xl shadow-xl shadow-indigo-500/30 mb-5">
          HF
        </div>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-indigo-500/10 dark:bg-indigo-500/15 border border-indigo-500/25 text-indigo-600 dark:text-indigo-300 text-[11px] font-bold mb-2.5">
          <span>🔒 Chế độ Cá nhân &amp; Đồng bộ Đám mây</span>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight">HabitFlow Private</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 max-w-[280px] leading-relaxed">
          Đăng nhập bằng tài khoản Google được cấp quyền để mở khóa và đồng bộ dữ liệu thói quen của bạn.
        </p>

        <!-- Thông báo lỗi khi đăng nhập sai Gmail -->
        <div x-show="authError" x-cloak
             class="mt-5 w-full p-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/35 text-rose-600 dark:text-rose-300 text-xs font-bold leading-relaxed">
          <span x-text="authError"></span>
        </div>

        <button type="button"
                @click="signInWithGoogle()"
                :disabled="authLoading"
                class="ios-spring-btn mt-7 w-full h-14 rounded-2xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-60 text-white font-extrabold text-sm shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-3">
          <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21.35 11.1h-9.17v2.73h6.51c-.33 1.81-1.5 3.34-3.2 4.37v3.62h5.18c3.03-2.79 4.78-6.9 4.78-11.77 0-.8-.08-1.58-.23-2.33l.13 3.38z" fill="#fff" fill-opacity="0.95"/>
            <path d="M12.18 22c4.32 0 7.95-1.43 10.6-3.88l-5.18-3.62c-1.44.97-3.28 1.55-5.42 1.55-4.17 0-7.7-2.81-8.96-6.59H-2.1v3.73C.54 18.43 5.94 22 12.18 22z" fill="#fff" fill-opacity="0.8"/>
          </svg>
          <span x-text="authLoading ? 'Đang kết nối Google...' : 'Đăng nhập bằng Google'"></span>
        </button>

        <p class="mt-6 text-[11px] text-slate-400 dark:text-slate-500">
          Bảo vệ bởi Supabase Auth · Chỉ dành cho chủ sở hữu
        </p>
      </div>

      <!-- ================= NỘI DUNG ỨNG DỤNG KHI ĐÃ ĐĂNG NHẬP (session) ================= -->
      <template x-if="session">
        <div class="flex-1 flex flex-col overflow-hidden">

          <!-- HEADER CỐ ĐỊNH PHÍA TRÊN (Hỗ trợ vuốt ngang trái/phải đổi tuần) -->
          <header @touchstart="onHeaderTouchStart($event)"
                  @touchend="onHeaderTouchEnd($event)"
                  class="ios-header shrink-0 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-4 pb-3 z-20">
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-base shadow-sm shadow-indigo-500/30 shrink-0">HF</div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <h1 class="text-base font-bold tracking-tight truncate">HabitFlow</h1>
                    <span class="text-xs font-semibold text-amber-500 dark:text-amber-400 tabular-nums shrink-0" x-text="'🔥 ' + appStreak + ' ngày'"></span>
                    <!-- Trạng thái đồng bộ đám mây nhỏ gọn -->
                    <button type="button"
                            @click="pushCloudData(true)"
                            :title="'Chạm để đồng bộ ngay (' + (session?.user?.email || '') + ')'"
                            class="ios-spring-btn text-[10px] font-bold px-1.5 py-0.5 rounded-md shrink-0"
                            :class="syncStatus === 'saving'
                              ? 'bg-amber-500/15 text-amber-600 dark:text-amber-300'
                              : (syncStatus === 'error'
                                ? 'bg-rose-500/15 text-rose-600 dark:text-rose-300'
                                : 'bg-emerald-500/12 text-emerald-600 dark:text-emerald-400')"
                            x-text="syncStatus === 'saving' ? '⏳ Đang lưu...' : (syncStatus === 'error' ? '⚠️ Lỗi đồng bộ' : '☁️ Đã đồng bộ')"></button>
                  </div>
                  <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate capitalize" x-text="formattedSelectedDate"></p>
                </div>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                <button x-show="weekOffset !== 0 || selectedDate !== todayKey"
                        @click="goToToday()"
                        class="ios-spring-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-500/15 text-indigo-600 dark:text-indigo-300">
                  Hôm nay
                </button>
                <div class="flex items-center bg-slate-100 dark:bg-slate-800 rounded-xl p-0.5">
                  <button @click="changeWeek(-1)" aria-label="Tuần trước" class="ios-spring-btn w-8 h-8 flex items-center justify-center rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700">&lt;</button>
                  <button @click="changeWeek(1)" aria-label="Tuần sau" class="ios-spring-btn w-8 h-8 flex items-center justify-center rounded-lg text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700">&gt;</button>
                </div>
              </div>
            </div>

            <!-- THANH LỊCH TUẦN 7 NGÀY (T2 -> CN, chấm Nhật ký/Cảm xúc màu tím hồng/xanh ngọc) -->
            <div class="grid grid-cols-7 gap-1.5">
              <template x-for="day in weekDays" :key="day.dateKey">
                <button @click="selectDate(day.dateKey)"
                        :class="selectedDate === day.dateKey
                          ? (day.isRest ? 'bg-sky-600 text-white shadow-md shadow-sky-600/25 ring-2 ring-sky-400/40' : 'bg-indigo-600 text-white shadow-md shadow-indigo-600/25 ring-2 ring-indigo-400/40')
                          : (day.isRest ? 'bg-sky-500/15 dark:bg-sky-500/20 text-sky-600 dark:text-sky-300 border border-sky-500/30' : (day.isToday ? 'bg-indigo-500/10 dark:bg-slate-800 text-indigo-600 dark:text-indigo-300 border border-indigo-500/30' : 'bg-slate-100/80 dark:bg-slate-800/70 text-slate-700 dark:text-slate-300'))"
                        class="ios-spring-btn flex flex-col items-center justify-center py-1.5 rounded-2xl min-h-[54px]">
                  <span class="text-[10px] font-semibold opacity-80" x-text="day.label"></span>
                  <span class="text-xs font-bold tabular-nums mt-0.5" x-text="day.dayNum"></span>
                  <div class="flex items-center gap-0.5 mt-1">
                    <span class="w-1.5 h-1.5 rounded-full"
                          :class="day.isRest
                            ? (selectedDate === day.dateKey ? 'bg-sky-200' : 'bg-sky-400')
                            : (selectedDate === day.dateKey
                              ? (day.pct >= 100 ? 'bg-emerald-300' : (day.pct > 0 ? 'bg-amber-300' : 'bg-white/40'))
                              : (day.pct >= 100 ? 'bg-emerald-500' : (day.pct >= 80 ? 'bg-indigo-500' : (day.pct > 0 ? 'bg-amber-500' : 'bg-slate-300 dark:bg-slate-700'))))"></span>
                    <span x-show="day.hasNoteOrMood" class="w-1 h-1 rounded-full"
                          :class="selectedDate === day.dateKey ? 'bg-sky-300' : 'bg-fuchsia-400'"></span>
                  </div>
                </button>
              </template>
            </div>
          </header>

          <!-- VÙNG NỘI DUNG CUỘN GIỮA (FLEX-1 OVERFLOW-Y-AUTO) -->
          <main x-ref="mainScroll" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 no-scrollbar">

            <!-- TAB 1: THÓI QUEN -->
            <div x-show="activeTab === 'habits'"
                 x-transition:enter="transition ease-[cubic-bezier(0.22,1,0.36,1)] duration-[220ms]"
                 x-transition:enter-start="opacity-0 translate-y-2"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 class="space-y-4 pb-4">
              <div x-show="selectedDate > todayKey" x-cloak
                   class="rounded-2xl px-3.5 py-2.5 bg-amber-500/15 border border-amber-500/30 text-amber-600 dark:text-amber-300 text-xs font-bold flex items-center justify-between gap-2">
                <span>📅 Ngày sắp tới — Xem trước lịch trình</span>
                <button @click="goToToday()" class="underline font-extrabold shrink-0">Về hôm nay</button>
              </div>

              <div x-show="selectedDate === todayKey && yesterdayRescue.shouldPrompt" x-cloak
                   class="rounded-2xl p-3 bg-amber-500/15 border border-amber-500/30 flex items-center justify-between gap-2.5">
                <p class="text-xs text-slate-700 dark:text-slate-200 leading-snug flex-1">
                  ⚠️ Hôm qua mới đạt <strong class="tabular-nums text-amber-600 dark:text-amber-400" x-text="yesterdayRescue.yesterdayPct + '%'"></strong> — Bạn quên chấm hay muốn bật Ngày nghỉ để cứu chuỗi?
                </p>
                <button @click="jumpToDate(yesterdayRescue.yesterdayKey)"
                        class="ios-spring-btn shrink-0 px-3 py-2 rounded-xl bg-amber-500 text-white text-xs font-extrabold">
                  Xem hôm qua
                </button>
              </div>

              <!-- Thẻ tổng quan ngày (dùng selectedSummary đã cache) -->
              <div :class="isRestDay(selectedDate) ? 'border-sky-500/40 dark:border-sky-500/35' : 'border-slate-200/80 dark:border-slate-700/70'"
                   class="rounded-3xl p-4 bg-white dark:bg-slate-800/90 border shadow-sm flex items-center justify-between gap-3.5">
                <div class="space-y-1.5 flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-xs font-medium text-slate-500 dark:text-slate-400 truncate">Tổng quan mục tiêu ngày</span>
                    <button @click="toggleRestDay(selectedDate)"
                            :class="isRestDay(selectedDate) ? 'bg-sky-500 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700/80 text-slate-600 dark:text-slate-300'"
                            class="ios-spring-btn px-2.5 py-1 rounded-xl text-[11px] font-bold whitespace-nowrap shrink-0"
                            x-text="isRestDay(selectedDate) ? 'Đang nghỉ ⛱️' : '⛱️ Ngày nghỉ'"></button>
                  </div>
                  <div class="text-xl font-extrabold tracking-tight tabular-nums">
                    <span x-text="selectedSummary.completedCount"></span>
                    <span class="text-slate-400 dark:text-slate-500 font-semibold">/</span>
                    <span x-text="selectedSummary.scheduledCount"></span>
                    <span class="text-sm font-semibold text-slate-500 dark:text-slate-400 ml-1">mục tiêu</span>
                  </div>
                  <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed font-medium"
                     x-text="getSmartCoachMessage(selectedDate)"></p>
                </div>

                <div class="relative w-16 h-16 shrink-0 flex items-center justify-center">
                  <svg class="w-16 h-16 -rotate-90" viewBox="0 0 64 64">
                    <circle cx="32" cy="32" r="26" stroke="currentColor" stroke-width="6" fill="transparent" class="text-slate-200 dark:text-slate-700" />
                    <circle cx="32" cy="32" r="26" stroke="currentColor" stroke-width="6" fill="transparent"
                            stroke-linecap="round"
                            class="ios-svg-ring"
                            :stroke-dasharray="163.36"
                            :stroke-dashoffset="163.36 * (1 - selectedSummary.percentage / 100)"
                            :class="isRestDay(selectedDate) ? 'text-sky-500' : (selectedSummary.percentage >= 100 ? 'text-emerald-500' : (selectedSummary.percentage >= 80 ? 'text-indigo-500' : 'text-amber-500'))" />
                  </svg>
                  <span class="absolute text-xs font-extrabold tabular-nums"
                        x-text="isRestDay(selectedDate) ? '⛱️' : (selectedSummary.percentage + '%')"></span>
                </div>
              </div>

              <!-- Thanh lọc nhanh: Ẩn việc đã xong & Sắp xếp -->
              <div class="flex items-center justify-between gap-2 px-1">
                <button @click="hideCompleted = !hideCompleted"
                        class="ios-spring-btn inline-flex items-center gap-2 py-1 text-xs font-semibold text-slate-600 dark:text-slate-300">
                  <span :class="hideCompleted ? 'bg-indigo-600' : 'bg-slate-300 dark:bg-slate-700'"
                        class="w-9 h-5 rounded-full p-0.5 transition-colors flex items-center">
                    <span :class="hideCompleted ? 'translate-x-4' : 'translate-x-0'"
                          class="w-4 h-4 rounded-full bg-white shadow transform transition-transform"></span>
                  </span>
                  <span>Ẩn việc đã xong</span>
                </button>

                <button @click="reorderMode = !reorderMode"
                        :class="reorderMode ? 'bg-indigo-600 text-white' : 'bg-slate-200/80 dark:bg-slate-800 text-slate-600 dark:text-slate-300'"
                        class="ios-spring-btn h-8 px-2.5 rounded-xl text-xs font-bold">
                  <span x-text="reorderMode ? '✓ Xong' : '⇅ Sắp xếp'"></span>
                </button>
              </div>

              <!-- Danh sách thói quen chia theo 3 khung giờ (Smooth Accordion) -->
              <template x-for="group in timeGroups" :key="group.key">
                <section x-show="getHabitsByGroup(group.key, false).length > 0" class="space-y-2">
                  <button @click="toggleGroupCollapse(group.key)"
                          class="w-full flex items-center justify-between gap-2 px-1 py-1 text-left">
                    <div class="flex items-center gap-2 min-w-0">
                      <span class="text-xs text-slate-400 transition-transform duration-200 inline-block"
                            :class="collapsedGroups[group.key] ? '-rotate-90' : 'rotate-0'">▾</span>
                      <h2 class="text-xs font-extrabold tracking-wider uppercase text-slate-600 dark:text-slate-300 truncate" x-text="group.label"></h2>
                      <span x-show="selectedDate === todayKey && currentTimeOfDay === group.key"
                            class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-600 dark:text-emerald-400 shrink-0">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>Đang diễn ra</span>
                      </span>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                      <span x-show="isGroupCompleted(group.key)"
                            class="text-[10px] font-bold text-emerald-600 dark:text-emerald-400"
                            x-text="collapsedGroups[group.key] ? 'Đã xong ✓' : 'Xong 100% · Thu gọn'"></span>
                      <span class="text-xs text-slate-400 dark:text-slate-500 tabular-nums font-bold"
                            x-text="getGroupCompletedCount(group.key) + '/' + getHabitsByGroup(group.key, false).length"></span>
                    </div>
                  </button>

                  <div class="ios-accordion-grid" :class="collapsedGroups[group.key] ? 'is-collapsed' : ''">
                    <div class="ios-accordion-inner">
                      <div class="space-y-2.5 pt-0.5">
                        <div x-show="getHabitsByGroup(group.key, true).length === 0"
                             class="rounded-2xl px-4 py-3 bg-slate-100/80 dark:bg-slate-800/50 border border-dashed border-slate-300 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400 text-center">
                          Đã hoàn thành toàn bộ mục trong khung giờ này.
                        </div>

                        <template x-for="(habit, idx) in getHabitsByGroup(group.key, true)" :key="habit.id">
                          <div class="relative overflow-hidden rounded-3xl">
                            <!-- Nền xanh lá lộ ra khi vuốt ngang thẻ sang phải -->
                            <div class="absolute inset-0 rounded-3xl bg-emerald-500/20 dark:bg-emerald-500/25 border border-emerald-500/40 flex items-center pl-4 pointer-events-none transition-opacity"
                                 :style="'opacity: ' + (getCardSwipeDelta(habit.id) > 6 ? Math.min(1, getCardSwipeDelta(habit.id) / 52) : 0)">
                              <span class="text-xs font-extrabold text-emerald-600 dark:text-emerald-300"
                                    x-text="getCardSwipeDelta(habit.id) >= 52 ? (habit.mode === 'check' ? '✓ Thả tay để hoàn thành' : ('✓ Thả tay cộng +' + habit.step + ' ' + habit.unit)) : '→ Vuốt phải để cộng nhanh'"></span>
                            </div>

                            <!-- Thẻ thói quen chính (kèm touch-action: pan-y) -->
                            <div @touchstart="onCardTouchStart(habit.id, $event)"
                                 @touchmove="onCardTouchMove(habit.id, $event)"
                                 @touchend="onCardTouchEnd(habit)"
                                 :style="getCardSwipeDelta(habit.id) > 0
                                   ? ('transform: translateX(' + getCardSwipeDelta(habit.id) + 'px); transition: none;')
                                   : 'transition: transform 0.28s var(--ease-ios);'"
                                 :class="[
                                   (isHabitCompleted(habit, selectedDate) || isWeeklyQuotaDone(habit, selectedDate)) ? 'border-emerald-500/30 dark:border-emerald-500/25' : 'border-slate-200/80 dark:border-slate-700/70',
                                   pulsingHabits[habit.id] ? 'animate-completion-pulse' : ''
                                 ]"
                                 class="habit-card-touch relative rounded-3xl p-3.5 bg-white dark:bg-slate-800/90 border shadow-sm">
                              <div class="flex items-center justify-between gap-2">
                                <div class="flex items-center gap-2.5 min-w-0 flex-1">
                                  <button @click="openEditModal(habit)"
                                          class="ios-spring-btn w-11 h-11 rounded-2xl flex items-center justify-center text-2xl shrink-0"
                                          :class="getColorClasses(habit.color).bgSoft">
                                    <span x-text="habit.icon"></span>
                                  </button>

                                  <div class="min-w-0 flex-1">
                                    <div class="flex items-center gap-1.5">
                                      <button @click="openEditModal(habit)"
                                              class="font-bold text-sm truncate text-left"
                                              :class="isHabitCompleted(habit, selectedDate) ? 'line-through text-slate-400 dark:text-slate-500' : ''"
                                              x-text="habit.name"></button>
                                      <span class="text-xs font-bold text-amber-500 dark:text-amber-400 shrink-0 tabular-nums"
                                            x-text="'🔥 ' + getHabitStreak(habit)"></span>
                                    </div>

                                    <div class="mt-0.5 flex items-center gap-1.5 flex-wrap text-xs text-slate-500 dark:text-slate-400 tabular-nums">
                                      <template x-if="habit.mode === 'check'">
                                        <button @click="openEditModal(habit)"
                                                x-text="isHabitCompleted(habit, selectedDate) ? 'Đã hoàn thành ✓' : (isWeeklyQuotaDone(habit, selectedDate) ? 'Đã đủ mục tiêu tuần ✓' : 'Đánh dấu 1 lần/ngày')"></button>
                                      </template>
                                      <template x-if="habit.mode === 'counter'">
                                        <button @click="openQuickInput(habit)"
                                                class="inline-flex items-center gap-1 font-bold underline decoration-dotted underline-offset-4 cursor-pointer"
                                                :class="isHabitCompleted(habit, selectedDate) ? 'text-emerald-600 dark:text-emerald-400' : getColorClasses(habit.color).text">
                                          <span x-text="getHabitVal(habit, selectedDate) + ' / ' + habit.target + ' ' + habit.unit"></span>
                                          <span class="text-[11px] no-underline opacity-70">✎</span>
                                        </button>
                                      </template>

                                      <span x-show="isWeeklyTargetHabit(habit)"
                                            :class="isWeeklyQuotaDone(habit, selectedDate) ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400' : 'bg-indigo-500/12 text-indigo-600 dark:text-indigo-300'"
                                            class="text-[10px] font-bold px-1.5 py-0.5 rounded-md tabular-nums"
                                            x-text="getWeeklyDoneCount(habit, selectedDate) + '/' + getWeeklyTargetGoal(habit) + ' buổi tuần này'"></span>
                                    </div>
                                  </div>
                                </div>

                                <!-- Cụm nút bên phải + Floating "+Step" Pop -->
                                <div class="relative flex items-center gap-1 shrink-0">
                                  <template x-for="pop in getPopsForHabit(habit.id)" :key="pop.id">
                                    <span class="animate-float-pop absolute -top-2 right-1 z-30 px-2 py-0.5 rounded-full bg-emerald-500 text-white text-[11px] font-extrabold tabular-nums shadow-md whitespace-nowrap"
                                          x-text="pop.label"></span>
                                  </template>

                                  <template x-if="reorderMode">
                                    <div class="flex items-center gap-1">
                                      <button @click="moveHabitInGroup(habit.id, -1)"
                                              :disabled="idx === 0"
                                              class="ios-spring-btn w-10 h-11 rounded-2xl bg-slate-100 dark:bg-slate-700/80 text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center disabled:opacity-30">↑</button>
                                      <button @click="moveHabitInGroup(habit.id, 1)"
                                              :disabled="idx === getHabitsByGroup(group.key, true).length - 1"
                                              class="ios-spring-btn w-10 h-11 rounded-2xl bg-slate-100 dark:bg-slate-700/80 text-slate-700 dark:text-slate-200 font-bold text-sm flex items-center justify-center disabled:opacity-30">↓</button>
                                    </div>
                                  </template>

                                  <template x-if="!reorderMode && habit.mode === 'check'">
                                    <button @click="toggleCheckHabit(habit)"
                                            :class="isHabitCompleted(habit, selectedDate)
                                              ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30'
                                              : 'bg-slate-100 dark:bg-slate-700/80 text-slate-500 dark:text-slate-300'"
                                            class="ios-spring-btn w-12 h-11 rounded-2xl flex items-center justify-center font-bold text-lg">
                                      <span :class="isHabitCompleted(habit, selectedDate) ? 'animate-check-pop' : ''"
                                            x-text="isHabitCompleted(habit, selectedDate) ? '✓' : '○'"></span>
                                    </button>
                                  </template>

                                  <template x-if="!reorderMode && habit.mode === 'counter'">
                                    <div class="flex items-center gap-1">
                                      <button x-show="isMinuteHabit(habit)"
                                              @click="toggleMiniTimer(habit)"
                                              :class="activeTimer?.habitId === habit.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700/80 text-indigo-600 dark:text-indigo-400'"
                                              class="ios-spring-btn w-9 h-11 rounded-xl font-bold text-xs flex items-center justify-center">▶</button>

                                      <button x-show="getHabitVal(habit, selectedDate) > 0"
                                              @click="incrementHabit(habit, -habit.step)"
                                              class="ios-spring-btn w-9 h-11 rounded-xl bg-slate-100 dark:bg-slate-700/80 text-slate-700 dark:text-slate-200 font-bold text-base flex items-center justify-center">-</button>

                                      <button @click="incrementHabit(habit, habit.step)"
                                              :class="isHabitCompleted(habit, selectedDate)
                                                ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30'
                                                : getColorClasses(habit.color).btn + ' shadow-sm'"
                                              class="ios-spring-btn min-w-[50px] h-11 px-2.5 rounded-2xl font-extrabold text-xs tabular-nums flex items-center justify-center gap-0.5">
                                        <span x-show="isHabitCompleted(habit, selectedDate)" class="animate-check-pop">✓</span>
                                        <span x-text="'+' + habit.step"></span>
                                      </button>
                                    </div>
                                  </template>
                                </div>
                              </div>

                              <!-- MINI TIMER ĐẾM NGƯỢC (Lưu bền bỉ habitflow_timer) -->
                              <div x-show="activeTimer?.habitId === habit.id" x-cloak
                                   class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700/60 space-y-2.5">
                                <div class="flex items-center justify-between gap-2">
                                  <span class="text-lg font-extrabold font-mono tabular-nums text-indigo-600 dark:text-indigo-400"
                                        x-text="'⏱ ' + formatTimerMMSS(activeTimer?.remainingSeconds ?? 0)"></span>

                                  <div x-show="activeTimer && !activeTimer.isRunning" class="flex items-center gap-1">
                                    <button @click="selectTimerMinutes(habit.step)"
                                            :class="activeTimer?.durationMinutes === habit.step ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'"
                                            class="px-2 py-1 rounded-lg text-[11px] font-bold tabular-nums"
                                            x-text="habit.step + 'p'"></button>
                                    <button x-show="getRemainingMins(habit) > 0 && getRemainingMins(habit) !== habit.step"
                                            @click="selectTimerMinutes(getRemainingMins(habit))"
                                            :class="activeTimer?.durationMinutes === getRemainingMins(habit) ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'"
                                            class="px-2 py-1 rounded-lg text-[11px] font-bold tabular-nums"
                                            x-text="'Thiếu ' + getRemainingMins(habit) + 'p'"></button>
                                    <button x-show="habit.target !== habit.step && habit.target !== getRemainingMins(habit)"
                                            @click="selectTimerMinutes(habit.target)"
                                            :class="activeTimer?.durationMinutes === habit.target ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'"
                                            class="px-2 py-1 rounded-lg text-[11px] font-bold tabular-nums"
                                            x-text="habit.target + 'p'"></button>
                                  </div>
                                </div>

                                <div class="w-full h-1.5 rounded-full bg-slate-100 dark:bg-slate-700 overflow-hidden">
                                  <div class="h-full bg-indigo-500 rounded-full ios-progress-bar"
                                       :style="'width: ' + getTimerProgressPct() + '%'"></div>
                                </div>

                                <div class="flex items-center gap-1.5">
                                  <button @click="startPauseTimer()"
                                         :class="activeTimer?.isRunning ? 'bg-amber-500 text-white' : 'bg-indigo-600 text-white'"
                                         class="ios-spring-btn flex-1 h-10 rounded-xl font-bold text-xs"
                                         x-text="activeTimer?.isRunning ? '⏸ Tạm dừng' : (getTimerElapsedSeconds() > 0 ? '▶ Tiếp tục' : ('▶ Bắt đầu (' + (activeTimer?.durationMinutes ?? 0) + 'p)'))"></button>

                                  <button x-show="getTimerElapsedSeconds() >= 1"
                                          @click="commitPartialTimer(habit)"
                                          class="ios-spring-btn h-10 px-3 rounded-xl bg-emerald-600 text-white font-extrabold text-xs tabular-nums whitespace-nowrap"
                                          x-text="'✓ Chốt (+' + getEarlyCommitMinutes() + ' phút)'"></button>

                                  <button @click="resetTimer()" class="ios-spring-btn w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold">↺</button>
                                  <button @click="closeMiniTimer()" class="ios-spring-btn w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-bold">✕</button>
                                </div>
                              </div>

                              <!-- Ô nhập nhanh số thực tế kèm nút "Đủ 100%" -->
                              <div x-show="quickInputHabitId === habit.id" x-cloak class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-700/60 flex items-center gap-1.5">
                                <input type="number" min="0" x-model.number="quickInputValue"
                                       @keydown.enter="saveQuickInput(habit)"
                                       class="flex-1 min-w-0 h-10 px-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-sm font-bold tabular-nums focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                       placeholder="Nhập số..." />
                                <button @click="quickInputValue = habit.target; saveQuickInput(habit)"
                                        class="ios-spring-btn h-10 px-2.5 rounded-xl bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 text-xs font-extrabold whitespace-nowrap">
                                  Đủ 100%
                                </button>
                                <button @click="saveQuickInput(habit)" class="ios-spring-btn h-10 px-3 rounded-xl bg-indigo-600 text-white text-xs font-bold">Lưu</button>
                                <button @click="quickInputHabitId = null" class="ios-spring-btn h-10 px-2 rounded-xl bg-slate-200 dark:bg-slate-700 text-xs font-semibold">✕</button>
                              </div>

                              <!-- Thanh progress bar mượt bên dưới cho chế độ Đếm -->
                              <template x-if="habit.mode === 'counter'">
                                <div class="mt-3 w-full h-2 rounded-full bg-slate-100 dark:bg-slate-700/70 overflow-hidden">
                                  <div class="h-full rounded-full ios-progress-bar"
                                       :class="isHabitCompleted(habit, selectedDate) ? 'bg-emerald-500' : getColorClasses(habit.color).bar"
                                       :style="'width: ' + Math.min(100, Math.round((getHabitVal(habit, selectedDate) / habit.target) * 100)) + '%'"></div>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                </section>
              </template>

              <!-- Bộ chọn 5 Cảm xúc (Daily Mood) + Ghi chú nhật ký ngắn (Debounce 300ms + Cloud Sync 600ms) -->
              <section class="rounded-3xl p-4 bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/70 shadow-sm space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-600 dark:text-slate-300">📝 Nhật ký ngắn trong ngày</h3>
                  <span class="text-[11px] text-slate-400" x-text="(notes[selectedDate]?.trim() || moods[selectedDate]) ? 'Đã lưu tự động' : 'Tùy chọn'"></span>
                </div>

                <div class="grid grid-cols-5 gap-1.5">
                  <template x-for="m in moodOptions" :key="m.emoji">
                    <button type="button" @click="selectMood(m.emoji)"
                            :class="moods[selectedDate] === m.emoji
                              ? 'bg-indigo-600/15 dark:bg-indigo-500/25 ring-2 ring-indigo-500 text-indigo-600 dark:text-indigo-300 font-bold'
                              : 'bg-slate-100/90 dark:bg-slate-900/70 text-slate-500 dark:text-slate-400'"
                            class="ios-spring-btn py-2 rounded-2xl flex flex-col items-center justify-center gap-0.5">
                      <span class="text-lg leading-none" x-text="m.emoji"></span>
                      <span class="text-[10px]" x-text="m.label"></span>
                    </button>
                  </template>
                </div>

                <textarea rows="2"
                          :value="notes[selectedDate] ?? ''"
                          @input="updateDailyNote($event.target.value)"
                          placeholder="Ghi lại cảm nhận, động lực hoặc bài học nhỏ hôm nay..."
                          class="w-full p-3 rounded-2xl bg-slate-100/90 dark:bg-slate-900/80 border border-slate-200/80 dark:border-slate-700/70 text-xs leading-relaxed text-slate-800 dark:text-slate-100 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
              </section>
            </div>

            <!-- TAB 2: THỐNG KÊ -->
            <div x-show="activeTab === 'stats'" x-cloak
                 x-transition:enter="transition ease-[cubic-bezier(0.22,1,0.36,1)] duration-[220ms]"
                 x-transition:enter-start="opacity-0 translate-y-2"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 class="space-y-4 pb-4">
              <div class="grid grid-cols-2 gap-3">
                <div class="rounded-3xl p-4 bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/70 shadow-sm">
                  <div class="text-xs font-medium text-slate-500 dark:text-slate-400">Chuỗi hiện tại (≥80%)</div>
                  <div class="mt-1.5 flex items-baseline gap-1.5">
                    <span class="text-2xl font-extrabold tabular-nums text-amber-500" x-text="appStreak"></span>
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">ngày</span>
                  </div>
                  <div class="mt-1 text-[11px] font-bold text-slate-400 dark:text-slate-500 tabular-nums"
                       x-text="'Kỷ lục: ' + bestStreak + ' ngày'"></div>
                </div>
                <div class="rounded-3xl p-4 bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/70 shadow-sm">
                  <div class="text-xs font-medium text-slate-500 dark:text-slate-400">TB hoàn thành 7 ngày</div>
                  <div class="mt-1.5 flex items-baseline gap-1.5">
                    <span class="text-2xl font-extrabold tabular-nums text-indigo-500" x-text="weeklyAverage + '%'"></span>
                    <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">tuần này</span>
                  </div>
                  <div class="mt-1 text-[11px] font-medium text-slate-400 dark:text-slate-500">Chỉ tính ngày đã qua</div>
                </div>
              </div>

              <!-- Thẻ Phân tích thông minh -->
              <div class="rounded-3xl p-4 bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/70 shadow-sm space-y-2.5">
                <h3 class="text-sm font-extrabold">✨ Phân tích thông minh (Tuần này)</h3>
                <div class="space-y-2 text-xs">
                  <div class="flex items-center justify-between gap-2 py-1 border-b border-slate-100 dark:border-slate-700/60">
                    <span class="text-slate-500 dark:text-slate-400 font-medium">🏆 Làm đều nhất</span>
                    <span class="font-bold text-emerald-600 dark:text-emerald-400 truncate tabular-nums" x-text="weeklyInsights.mostConsistent"></span>
                  </div>
                  <div class="flex items-center justify-between gap-2 py-1 border-b border-slate-100 dark:border-slate-700/60">
                    <span class="text-slate-500 dark:text-slate-400 font-medium">⚠️ Hay bỏ quên nhất</span>
                    <span class="font-bold truncate tabular-nums"
                          :class="weeklyInsights.allHigh ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500 dark:text-rose-400'"
                          x-text="weeklyInsights.mostMissed"></span>
                  </div>
                  <div class="flex items-center justify-between gap-2 pt-1">
                    <span class="text-slate-500 dark:text-slate-400 font-medium">⚡ Ngày năng suất nhất</span>
                    <span class="font-bold text-indigo-600 dark:text-indigo-400 truncate tabular-nums" x-text="weeklyInsights.mostProductiveDay"></span>
                  </div>
                </div>
              </div>

              <!-- Thẻ "🏅 Tích lũy tuần này" -->
              <div class="rounded-3xl p-4 bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/70 shadow-sm space-y-2.5">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-extrabold">🏅 Tích lũy tuần này</h3>
                  <span class="text-[11px] text-slate-400">Tổng khối lượng đã làm</span>
                </div>
                <p x-show="weeklyAccumulations.length === 0" class="text-xs text-slate-500 dark:text-slate-400">
                  Chưa có dữ liệu tích lũy trong tuần này.
                </p>
                <div x-show="weeklyAccumulations.length > 0" class="grid grid-cols-2 gap-2">
                  <template x-for="(acc, accIdx) in weeklyAccumulations" :key="'acc-' + acc.id">
                    <div :class="(weeklyAccumulations.length % 2 === 1 && accIdx === weeklyAccumulations.length - 1) ? 'col-span-2' : ''"
                         class="p-2.5 rounded-2xl bg-slate-100/80 dark:bg-slate-900/60 flex items-center gap-2.5">
                      <span class="text-xl shrink-0" x-text="acc.icon"></span>
                      <div class="min-w-0">
                        <div class="text-xs font-extrabold tabular-nums truncate" x-text="acc.formattedTotal + ' ' + acc.unit"></div>
                        <div class="text-[10px] text-slate-500 dark:text-slate-400 truncate" x-text="acc.name"></div>
                      </div>
                    </div>
                  </template>
                </div>
              </div>

              <!-- Biểu đồ cột 7 ngày trong tuần -->
              <div class="rounded-3xl p-4 bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/70 shadow-sm space-y-3">
                <div class="flex items-center justify-between">
                  <h3 class="text-sm font-bold">Biểu đồ 7 ngày trong tuần</h3>
                  <span class="text-xs text-slate-500 dark:text-slate-400 tabular-nums">Mục tiêu chuỗi: 80%</span>
                </div>
                <div class="grid grid-cols-7 gap-2 items-end h-36 pt-4 px-1">
                  <template x-for="(day, bIdx) in weekDays" :key="'bar-' + day.dateKey + '-' + statsAnimSeed">
                    <button @click="selectDate(day.dateKey); switchTab('habits')" class="ios-spring-btn flex flex-col items-center h-full justify-end gap-1.5">
                      <span class="text-[10px] font-bold tabular-nums text-slate-500 dark:text-slate-400"
                            x-text="day.isRest ? '⛱️' : (day.dateKey > todayKey ? '—' : (day.pct + '%'))"></span>
                      <div class="w-full h-24 bg-slate-100 dark:bg-slate-700/60 rounded-xl overflow-hidden flex items-end p-0.5">
                        <div class="w-full rounded-lg animate-bar-rise transition-all duration-300"
                             :class="day.isRest ? 'bg-sky-400' : (day.pct >= 100 ? 'bg-emerald-500' : (day.pct >= 80 ? 'bg-indigo-500' : (day.pct > 0 ? 'bg-amber-500' : 'bg-transparent')))"

        return Array.isArray(obj) ? obj.map(x => ({ ...x })) : { ...obj };

    };

    const readStorage = (key, fallback) => {
      try {
        const raw = localStorage.getItem(key);
        if (raw === null) return typeof fallback === 'function' ? fallback() : fallback;
        return JSON.parse(raw);
      } catch {
        return typeof fallback === 'function' ? fallback() : fallback;
      }
    };

    const saveKey = (key, val) => {

        if (val === null || val === undefined) localStorage.removeItem(key);
        else localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val));
      } catch {}
    };

    function habitFlowApp() {
      return {

        quickPresets: QUICK_PRESETS,
        timeGroups: TIME_GROUPS,
        weekDayOptions: WEEK_DAY_OPTIONS,

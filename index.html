        colorOptions: COLOR_OPTIONS,

        // Supabase Auth & Cloud Sync State
        session: null,
        authLoading: false,
        authError: '',
        syncStatus: 'synced', // 'synced' | 'saving' | 'error'
        cloudSyncTimer: null,
        cloudColumnMode: 'payload', // 'payload' | 'data' | 'columns'
        syncedUserId: null,

        // Reactive App State
        darkMode: true,
        soundEnabled: true,
        audioCtx: null,
        activeTab: 'habits',
        statsAnimSeed: 1,
        dataVersion: 1,
        _cache: new Map(),
        todayKey: '',
        selectedDate: '',
        currentTimeOfDay: 'morning',
        weekOffset: 0,
        habits: [],
        logs: {},
        notes: {},
        restDays: {},
        moods: {},
        hideCompleted: false,
        reorderMode: false,
        collapsedGroups: { morning: false, day: false, evening: false },
        sheetOpen: false,
        sheetDragStartY: null,
        sheetDragY: 0,
        editingHabitId: null,
        confirmDialog: { open: false, action: '', payload: null, step: 1, title: '', message: '', confirmLabel: '', tone: 'rose' },
        quickInputHabitId: null,
        quickInputValue: 0,
        activeTimer: null,
        timerInterval: null,
        noteDebounceTimer: null,
        floatingPops: [],
        pulsingHabits: {},
        cardSwipe: { habitId: null, startX: 0, startY: 0, deltaX: 0, isHorizontal: null },
        headerTouchStart: null,
        toast: { visible: false, message: '', tone: 'default', undo: null },
        toastTimeout: null,
        form: {
          name: '', timeOfDay: 'morning', mode: 'counter', target: 1, step: 1, unit: 'lần',
          icon: '🪥', color: 'indigo', frequencyType: 'days', weeklyTarget: 4,
          daysOfWeek: [1,2,3,4,5,6,7], reminderTime: '07:00'
        },

        // ================= SUPABASE AUTH & 2-WAY CLOUD SYNC =================
        async initSupabaseAuth() {
          if (!supabase) {
            this.authError = 'Không thể khởi tạo kết nối Supabase.';
            return;
          }
          try {
            const { data } = await supabase.auth.getSession();
            await this.handleAuthSession(data?.session ?? null);
          } catch {}

          supabase.auth.onAuthStateChange((_event, newSession) => {
            this.handleAuthSession(newSession);
          });
        },

        async handleAuthSession(newSession) {
          if (!newSession?.user) {
            this.session = null;
            this.syncedUserId = null;
            return;
          }
          const email = (newSession.user.email ?? '').trim().toLowerCase();
          if (email !== ALLOWED_EMAIL.toLowerCase()) {
            await supabase.auth.signOut();
            this.session = null;
            this.syncedUserId = null;
            this.authError = 'Tài khoản Google này không có quyền truy cập ứng dụng.';
            this.showToast('Tài khoản Google này không có quyền truy cập ứng dụng.', 'error');
            return;
          }
          this.authError = '';
          this.session = newSession;
          if (this.syncedUserId !== newSession.user.id) {
            this.syncedUserId = newSession.user.id;
            await this.initialCloudSync();
          }
        },

        async signInWithGoogle() {
          if (!supabase) return;
          this.authLoading = true;
          this.authError = '';
          try {
            const { error } = await supabase.auth.signInWithOAuth({
              provider: 'google',
              options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) {
              this.authError = error.message || 'Không thể đăng nhập bằng Google.';
              this.authLoading = false;
            }
          } catch {
            this.authError = 'Đã xảy ra lỗi khi chuyển hướng đăng nhập Google.';
            this.authLoading = false;
          }
        },

        async signOutGoogle() {
          if (!supabase) return;
          if (this.cloudSyncTimer) {
            clearTimeout(this.cloudSyncTimer);
            this.cloudSyncTimer = null;
            await this.pushCloudData(true);
          }
          await supabase.auth.signOut();
          this.session = null;
          this.syncedUserId = null;
          this.showToast('Đã đăng xuất khỏi tài khoản Google.');
        },

        async initialCloudSync() {
          if (!supabase || !this.session?.user?.id) return;
          this.syncStatus = 'saving';
          const userId = this.session.user.id;
          try {
            const { data, error } = await supabase
              .from('habitflow_data')
              .select('*')
              .eq('user_id', userId)
              .maybeSingle();

            if (error) {
              this.syncStatus = 'error';
              return;
            }

            if (data) {
              let cloudObj = null;
              if (data.payload && typeof data.payload === 'object') {
                this.cloudColumnMode = 'payload';
                cloudObj = data.payload;
              } else if (data.data && typeof data.data === 'object') {
                this.cloudColumnMode = 'data';
                cloudObj = data.data;
              } else if (Array.isArray(data.habits)) {
                this.cloudColumnMode = 'columns';
                cloudObj = data;
              }

              if (cloudObj && Array.isArray(cloudObj.habits) && cloudObj.habits.length > 0) {
                this.habits = cloudObj.habits;
                this.logs = (cloudObj.logs && typeof cloudObj.logs === 'object') ? cloudObj.logs : {};
                this.notes = (cloudObj.notes && typeof cloudObj.notes === 'object') ? cloudObj.notes : {};
                const rDays = cloudObj.restDays ?? cloudObj.rest_days;
                this.restDays = (rDays && typeof rDays === 'object') ? rDays : {};
                this.moods = (cloudObj.moods && typeof cloudObj.moods === 'object') ? cloudObj.moods : {};

                saveKey(KEYS.HABITS, this.habits);
                saveKey(KEYS.LOGS, this.logs);
                saveKey(KEYS.NOTES, this.notes);
                saveKey(KEYS.REST_DAYS, this.restDays);
                saveKey(KEYS.MOODS, this.moods);
                this.bumpVersion();
                this.syncStatus = 'synced';
                return;
              }
            }

            // Chưa có dữ liệu trên Supabase -> đẩy dữ liệu localStorage hiện có lên
            await this.pushCloudData(true);
          } catch {
            this.syncStatus = 'error';
          }
        },

        scheduleCloudSync() {
          if (!supabase || !this.session?.user?.id) return;
          this.syncStatus = 'saving';
          if (this.cloudSyncTimer) clearTimeout(this.cloudSyncTimer);
          this.cloudSyncTimer = setTimeout(() => {
            this.cloudSyncTimer = null;
            this.pushCloudData();
          }, 600);
        },

        async pushCloudData(isManual = false) {
          if (!supabase || !this.session?.user?.id) return;
          this.syncStatus = 'saving';
          const userId = this.session.user.id;
          const nowIso = new Date().toISOString();
          const snapshot = {
            habits: this.habits,
            logs: this.logs,
            notes: this.notes,
            restDays: this.restDays,
            moods: this.moods,
            updatedAt: nowIso
          };

          const buildRow = (mode) => {
            if (mode === 'data') return { user_id: userId, data: snapshot, updated_at: nowIso };
            if (mode === 'columns') {
              return {
                user_id: userId,
                habits: this.habits,
                logs: this.logs,
                notes: this.notes,
                rest_days: this.restDays,
                moods: this.moods,
                updated_at: nowIso
              };
            }
            return { user_id: userId, payload: snapshot, updated_at: nowIso };
          };

          try {
            let modesToTry = [this.cloudColumnMode, 'payload', 'data', 'columns'].filter((v, i, a) => a.indexOf(v) === i);
            let lastErr = null;
            for (const mode of modesToTry) {
              const { error } = await supabase
                .from('habitflow_data')
                .upsert(buildRow(mode), { onConflict: 'user_id' });
              if (!error) {
                this.cloudColumnMode = mode;
                this.syncStatus = 'synced';
                if (isManual) this.showToast('☁️ Đã đồng bộ dữ liệu lên Supabase!', 'success');
                return;
              }
              lastErr = error;
            }
            if (lastErr) this.syncStatus = 'error';
          } catch {
            this.syncStatus = 'error';
          }
        },

        // ================= CACHE & COMPUTED GETTERS =================
        memo(key, fn) {
          const fullKey = this.dataVersion + ':' + key;
          if (this._cache.has(fullKey)) return this._cache.get(fullKey);
          const val = fn();
          this._cache.set(fullKey, val);
          return val;
        },

        bumpVersion() {
          this.dataVersion++;
          this._cache.clear();
        },

        get formattedSelectedDate() {
          return this.selectedDate ? VI_DATE_FMT.format(this.parseDateKey(this.selectedDate)) : '';
        },

        get selectedSummary() {
          return this.memo('sum:' + this.selectedDate, () => this.getDaySummary(this.selectedDate));
        },

        get archivedHabits() {
          return this.memo('archived', () => this.habits.filter(h => h.archived));
        },

        get weekDays() {
          return this.memo('week:' + this.weekOffset + ':' + this.todayKey, () => {
            const base = this.addDays(this.parseDateKey(this.todayKey), this.weekOffset * 7);
            const monday = this.getMondayOfDate(base);
            const labels = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
            return labels.map((label, i) => {
              const d = this.addDays(monday, i);
              const key = this.formatDateKey(d);
              return {
                label,
                dayNum: d.getDate(),
                dateKey: key,
                isToday: key === this.todayKey,
                isRest: Boolean(this.restDays[key]),
                hasNoteOrMood: Boolean(this.notes[key]?.trim() || this.moods[key]),
                pct: this.getDaySummary(key).percentage
              };
            });
          });
        },

        get appStreak() {
          return this.memo('appStreak:' + this.todayKey, () => {
            if (!this.habits.length) return 0;
            let streak = 0;
            const ref = this.parseDateKey(this.todayKey);
            for (let i = 0; i < 365; i++) {
              const key = this.formatDateKey(this.addDays(ref, -i));
              const sum = this.getDaySummary(key);
              if (sum.scheduledCount === 0) continue;
              if (sum.percentage >= 80) { streak++; continue; }
              if (this.isRestDay(key) || i === 0) continue;
              break;
            }
            return streak;
          });
        },

        get bestStreak() {
          return this.memo('bestStreak:' + this.todayKey, () => {
            if (!this.habits.length) return 0;
            let best = this.appStreak;
            let running = 0;
            const allKeys = [...Object.keys(this.logs), ...Object.keys(this.restDays), this.todayKey].sort();
            const today = this.parseDateKey(this.todayKey);
            const earliest = this.parseDateKey(allKeys[0] || this.todayKey);
            const diffDays = Math.min(365, Math.max(30, Math.round((today.getTime() - earliest.getTime()) / 86400000) + 1));
            for (let i = diffDays; i >= 0; i--) {
              const key = this.formatDateKey(this.addDays(today, -i));
              const sum = this.getDaySummary(key);
              if (sum.scheduledCount === 0) continue;
              if (sum.percentage >= 80) {
                if (++running > best) best = running;
              } else if (!this.isRestDay(key) && i !== 0) {
                running = 0;
              }
            }
            return best;
          });
        },

        get yesterdayRescue() {
          return this.memo('rescue:' + this.todayKey, () => {
            const today = this.parseDateKey(this.todayKey);
            const yKey = this.formatDateKey(this.addDays(today, -1));
            if (this.isRestDay(yKey)) return { shouldPrompt: false, yesterdayKey: yKey, yesterdayPct: 0 };
            const ySum = this.getDaySummary(yKey);
            if (ySum.scheduledCount === 0 || ySum.percentage >= 80) {
              return { shouldPrompt: false, yesterdayKey: yKey, yesterdayPct: ySum.percentage };
            }
            let prior = 0;
            for (let i = 2; i < 365; i++) {
              const key = this.formatDateKey(this.addDays(today, -i));
              const sum = this.getDaySummary(key);
              if (sum.scheduledCount === 0) continue;
              if (sum.percentage >= 80) prior++;
              else if (this.isRestDay(key)) continue;
              else break;
            }
            return { shouldPrompt: prior >= 2, yesterdayKey: yKey, yesterdayPct: ySum.percentage };
          });
        },

        get weeklyAverage() {
          return this.memo('wAvg:' + this.weekOffset + ':' + this.todayKey, () => {
            const eligible = this.weekDays.filter(d => this.isDayEligibleForStats(d));
            if (!eligible.length) return 0;
            return Math.round(eligible.reduce((acc, d) => acc + d.pct, 0) / eligible.length);
          });
        },

        get weeklyBreakdown() {
          return this.memo('wBreak:' + this.weekOffset + ':' + this.todayKey, () => {
            const allDays = this.weekDays;
            const eligible = allDays.filter(d => this.isDayEligibleForStats(d));
            return this.habits.filter(h => !h.archived).map(h => {
              if (this.isWeeklyTargetHabit(h)) {
                const scheduledDays = this.getWeeklyTargetGoal(h);
                const completedDays = allDays.filter(d => d.dateKey <= this.todayKey && this.isHabitCompleted(h, d.dateKey)).length;
                const rate = scheduledDays > 0 ? Math.min(100, Math.round((completedDays / scheduledDays) * 100)) : 0;
                return { id: h.id, name: h.name, icon: h.icon, color: h.color, scheduledDays, completedDays, rate, unitLabel: 'buổi' };
              }
              let scheduledDays = 0, completedDays = 0;
              eligible.forEach(d => {
                if (this.isHabitApplicable(h, d.dateKey)) {
                  scheduledDays++;
                  if (this.isHabitCompleted(h, d.dateKey)) completedDays++;
                }
              });
              const rate = scheduledDays > 0 ? Math.round((completedDays / scheduledDays) * 100) : 0;
              return { id: h.id, name: h.name, icon: h.icon, color: h.color, scheduledDays, completedDays, rate, unitLabel: 'ngày' };
            });
          });
        },

        get weeklyInsights() {
          return this.memo('wIns:' + this.weekOffset + ':' + this.todayKey, () => {
            const eligible = this.weekDays.filter(d => this.isDayEligibleForStats(d));
            const breakdown = this.weeklyBreakdown.filter(i => i.scheduledDays > 0);
            let mostConsistent = 'Chưa có dữ liệu', mostMissed = 'Chưa có dữ liệu', allHigh = false;
            if (breakdown.length) {
              const sorted = [...breakdown].sort((a, b) => b.rate - a.rate);
              mostConsistent = sorted[0].icon + ' ' + sorted[0].name + ' (' + sorted[0].rate + '%)';
              const last = sorted[sorted.length - 1];
              if (last.rate >= 90) {
                mostMissed = 'Không có — Giữ phong độ quá tốt!';
                allHigh = true;
              } else {
                mostMissed = last.icon + ' ' + last.name + ' (' + last.rate + '%)';
              }
            }
            const fullNames = { T2: 'Thứ Hai', T3: 'Thứ Ba', T4: 'Thứ Tư', T5: 'Thứ Năm', T6: 'Thứ Sáu', T7: 'Thứ Bảy', CN: 'Chủ Nhật' };
            const activeDays = eligible.filter(d => d.pct > 0);
            let mostProductiveDay = 'Chưa có dữ liệu';
            if (activeDays.length) {
              const maxPct = Math.max(...activeDays.map(d => d.pct));
              const topDays = activeDays.filter(d => d.pct === maxPct);
              const labelStr = topDays.length === 1 ? (fullNames[topDays[0].label] ?? topDays[0].label) : topDays.map(d => d.label).join(', ');
              mostProductiveDay = labelStr + ' (' + maxPct + '%)';
            }
            return { mostConsistent, mostMissed, mostProductiveDay, allHigh };
          });
        },

        get weeklyAccumulations() {
          return this.memo('wAcc:' + this.weekOffset + ':' + this.todayKey, () => {
            const days = this.weekDays.filter(d => d.dateKey <= this.todayKey);
            return this.habits
              .filter(h => !h.archived && h.mode === 'counter')
              .map(h => {
                const total = Math.round(days.reduce((sum, d) => sum + this.getHabitVal(h, d.dateKey), 0) * 100) / 100;
                return { id: h.id, name: h.name, icon: h.icon, unit: h.unit, total, formattedTotal: total.toLocaleString('vi-VN') };
              })
              .filter(item => item.total > 0);
          });
        },

        get recentNotes() {
          return this.memo('rNotes', () => {
            const keys = Array.from(new Set([...Object.keys(this.notes), ...Object.keys(this.moods)]))
              .filter(k => this.notes[k]?.trim() || this.moods[k])
              .sort((a, b) => (a < b ? 1 : -1))
              .slice(0, 5);
            const dayNames = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
            return keys.map(k => {
              const d = this.parseDateKey(k);
              return {
                dateKey: k,
                label: dayNames[d.getDay()] + ', ' + d.getDate() + '/' + (d.getMonth() + 1),
                mood: this.moods[k] ?? null,
                note: (this.notes[k] ?? '').trim()
              };
            });
          });
        },

        get heatmap30Days() {
          return this.memo('heat30:' + this.todayKey, () => {
            const res = [];
            const ref = this.parseDateKey(this.todayKey);
            for (let i = 29; i >= 0; i--) {
              const d = this.addDays(ref, -i);
              const key = this.formatDateKey(d);
              res.push({
                dateKey: key,
                dayNum: d.getDate(),
                isRest: this.isRestDay(key),
                pct: this.getDaySummary(key).percentage
              });
            }
            return res;
          });
        },

        // ================= LIFECYCLE & STORAGE =================
        init() {
          const now = new Date();
          this.todayKey = this.formatDateKey(now);
          this.selectedDate = this.todayKey;
          this.currentTimeOfDay = this.detectTimeOfDay(now);

          this.darkMode = localStorage.getItem(KEYS.DARK) !== 'false';
          this.syncThemeMeta();
          this.soundEnabled = localStorage.getItem(KEYS.SOUND) !== 'false';

          this.habits = readStorage(KEYS.HABITS, () => cloneData(DEFAULT_HABITS));
          this.logs = readStorage(KEYS.LOGS, {});
          this.notes = readStorage(KEYS.NOTES, {});
          this.restDays = readStorage(KEYS.REST_DAYS, {});
          this.moods = readStorage(KEYS.MOODS, {});
          this.bumpVersion();

          saveKey(KEYS.HABITS, this.habits);
          saveKey(KEYS.DARK, String(this.darkMode));
          saveKey(KEYS.SOUND, String(this.soundEnabled));

          this.restoreSavedTimer();
          this.initSupabaseAuth();

          const checkRolloverAndTimer = () => {
            const current = new Date();
            this.currentTimeOfDay = this.detectTimeOfDay(current);
            const realToday = this.formatDateKey(current);
            if (realToday !== this.todayKey) {
              this.todayKey = realToday;
              this.weekOffset = 0;
              this.selectedDate = realToday;
              this.quickInputHabitId = null;
              this.bumpVersion();
              this.showToast('Chào ngày mới! Đã tự động cập nhật lịch hôm nay.', 'success');
            }
            this.syncRunningTimerOnResume();
          };
          window.addEventListener('focus', checkRolloverAndTimer);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') checkRolloverAndTimer();
          });
          setInterval(checkRolloverAndTimer, 60000);
        },

        syncThemeMeta() {
          document.documentElement.classList.toggle('dark', this.darkMode);
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', this.darkMode ? '#0f172a' : '#ffffff');
        },

        playSound(type = 'pop') {
          if (!this.soundEnabled) return;
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.audioCtx ??= new AudioCtx();
            if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            const now = this.audioCtx.currentTime;
            if (type === 'pop') {
              const osc = this.audioCtx.createOscillator();
              const gain = this.audioCtx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(340, now);
              osc.frequency.exponentialRampToValueAtTime(580, now + 0.065);
              gain.gain.setValueAtTime(0.08, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
              osc.connect(gain);
              gain.connect(this.audioCtx.destination);
              osc.start(now);
              osc.stop(now + 0.075);
            } else {
              [587.33, 880].forEach((freq, idx) => {
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                const start = now + idx * 0.08;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, start);
                gain.gain.setValueAtTime(0.11, start);
                gain.gain.exponentialRampToValueAtTime(0.001, start + 0.24);
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);
                osc.start(start);
                osc.stop(start + 0.25);
              });
            }
          } catch {}
        },

        toggleSound() {
          this.soundEnabled = !this.soundEnabled;
          saveKey(KEYS.SOUND, String(this.soundEnabled));
          if (this.soundEnabled) this.playSound('pop');
        },

        spawnFloatingPop(habitId, label) {
          const id = Date.now() + Math.random();
          this.floatingPops.push({ id, habitId, label });
          setTimeout(() => {
            this.floatingPops = this.floatingPops.filter(p => p.id !== id);
          }, 560);
        },

        getPopsForHabit(habitId) {
          return this.floatingPops.filter(p => p.habitId === habitId);
        },

        triggerCompletionPulse(habitId) {
          this.pulsingHabits = { ...this.pulsingHabits, [habitId]: true };
          setTimeout(() => {
            const copy = { ...this.pulsingHabits };
            delete copy[habitId];
            this.pulsingHabits = copy;
          }, 600);
        },

        // ================= TOUCH SWIPE GESTURES =================
        onCardTouchStart(habitId, e) {
          if (this.reorderMode || this.quickInputHabitId === habitId) return;
          const t = e.touches[0];
          this.cardSwipe = { habitId, startX: t.clientX, startY: t.clientY, deltaX: 0, isHorizontal: null };
        },

        onCardTouchMove(habitId, e) {
          if (this.cardSwipe.habitId !== habitId) return;
          const t = e.touches[0];
          const dx = t.clientX - this.cardSwipe.startX;
          const dy = t.clientY - this.cardSwipe.startY;
          if (this.cardSwipe.isHorizontal === null) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
            this.cardSwipe.isHorizontal = Math.abs(dx) > Math.abs(dy) * 1.25 && dx > 0;
          }
          this.cardSwipe.deltaX = this.cardSwipe.isHorizontal ? Math.min(96, Math.max(0, dx * 0.78)) : 0;
        },

        onCardTouchEnd(habit) {
          if (this.cardSwipe.habitId !== habit.id) return;
          const triggered = this.cardSwipe.isHorizontal === true && this.cardSwipe.deltaX >= 52;
          this.cardSwipe = { habitId: null, startX: 0, startY: 0, deltaX: 0, isHorizontal: null };
          if (triggered) {
            habit.mode === 'check' ? this.toggleCheckHabit(habit) : this.incrementHabit(habit, habit.step);
          }
        },

        getCardSwipeDelta(habitId) {
          return (this.cardSwipe.habitId === habitId && this.cardSwipe.isHorizontal) ? this.cardSwipe.deltaX : 0;
        },

        onHeaderTouchStart(e) {
          const t = e.touches[0];
          this.headerTouchStart = { x: t.clientX, y: t.clientY };
        },

        onHeaderTouchEnd(e) {
          if (!this.headerTouchStart) return;
          const t = e.changedTouches[0];
          const dx = t.clientX - this.headerTouchStart.x;
          const dy = t.clientY - this.headerTouchStart.y;
          this.headerTouchStart = null;
          if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            this.changeWeek(dx < 0 ? 1 : -1);
          }
        },

        onSheetTouchStart(e) {
          this.sheetDragStartY = e.touches[0].clientY;
          this.sheetDragY = 0;
        },

        onSheetTouchMove(e) {
          if (this.sheetDragStartY === null) return;
          this.sheetDragY = Math.max(0, e.touches[0].clientY - this.sheetDragStartY);
        },

        onSheetTouchEnd() {
          if (this.sheetDragStartY === null) return;
          const shouldClose = this.sheetDragY > 80;
          this.sheetDragStartY = null;
          this.sheetDragY = 0;
          if (shouldClose) this.sheetOpen = false;
        },

        detectTimeOfDay(d) {
          const h = d.getHours();
          return h >= 5 && h < 11 ? 'morning' : (h >= 11 && h < 17 ? 'day' : 'evening');
        },

        getDefaultReminderTime(timeOfDay) {
          return timeOfDay === 'morning' ? '07:00' : (timeOfDay === 'day' ? '12:30' : '20:30');
        },

        showToast(message, tone = 'default', undo = null) {
          if (this.toastTimeout) clearTimeout(this.toastTimeout);
          this.toast = { visible: true, message, tone, undo };
          this.toastTimeout = setTimeout(() => { this.toast.visible = false; }, 3500);
        },

        undoLastAction() {
          if (!this.toast.undo) return;
          const { habitId, dateKey, prevValue } = this.toast.undo;
          this.logs[dateKey] ??= {};
          this.logs[dateKey][habitId] = prevValue;
          saveKey(KEYS.LOGS, this.logs);
          this.bumpVersion();
          this.scheduleCloudSync();
          this.showToast('Đã hoàn tác thao tác vừa rồi.');
        },

        switchTab(tab) {
          this.activeTab = tab;
          if (tab === 'stats') this.statsAnimSeed++;
          this.quickInputHabitId = null;
          this.$refs.mainScroll?.scrollTo({ top: 0, behavior: 'smooth' });
        },

        toggleDarkMode() {
          this.darkMode = !this.darkMode;
          this.syncThemeMeta();
          saveKey(KEYS.DARK, String(this.darkMode));
        },

        toggleGroupCollapse(key) {
          this.collapsedGroups[key] = !this.collapsedGroups[key];
        },

        isRestDay(dateKey) {
          return Boolean(this.restDays[dateKey]);
        },

        toggleRestDay(dateKey) {
          if (this.restDays[dateKey]) {
            delete this.restDays[dateKey];
            this.showToast('Đã tắt chế độ Ngày nghỉ.');
          } else {
            this.restDays[dateKey] = true;
            this.showToast('⛱️ Đã bật Ngày nghỉ — Chuỗi ngày được bảo vệ an toàn!', 'success');
          }
          this.restDays = { ...this.restDays };
          saveKey(KEYS.REST_DAYS, this.restDays);
          this.bumpVersion();
          this.scheduleCloudSync();
        },

        selectMood(emoji) {
          if (this.moods[this.selectedDate] === emoji) {
            delete this.moods[this.selectedDate];
          } else {
            this.moods[this.selectedDate] = emoji;
            this.playSound('pop');
          }
          this.moods = { ...this.moods };
          saveKey(KEYS.MOODS, this.moods);
          this.bumpVersion();
          this.scheduleCloudSync();
        },

        updateDailyNote(text) {
          this.notes[this.selectedDate] = text;
          if (this.noteDebounceTimer) clearTimeout(this.noteDebounceTimer);
          this.noteDebounceTimer = setTimeout(() => {
            saveKey(KEYS.NOTES, this.notes);
            this.bumpVersion();
            this.scheduleCloudSync();
          }, 300);
        },

        formatDateKey(d) {
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        },

        parseDateKey(key) {
          const [y, m, d] = key.split('-').map(Number);
          return new Date(y, m - 1, d, 12, 0, 0);
        },

        addDays(d, n) {
          const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
          copy.setDate(copy.getDate() + n);
          return copy;
        },

        getDayOfWeek1To7(d) {
          return d.getDay() || 7;
        },

        getMondayOfDate(d) {
          return this.addDays(d, -(this.getDayOfWeek1To7(d) - 1));
        },

        getColorClasses(color) {
          return COLOR_MAP[color] ?? COLOR_MAP.indigo;
        },

        // ================= MINI TIMER (LƯU BỀN BỈ habitflow_timer) =================
        isMinuteHabit(habit) {
          return habit.mode === 'counter' && /phút/i.test(habit.unit ?? '');
        },

        getRemainingMins(habit) {
          return Math.max(0, Math.round(habit.target - this.getHabitVal(habit, this.selectedDate)));
        },

        saveTimerState() {
          saveKey(KEYS.TIMER, this.activeTimer);
        },

        restoreSavedTimer() {
          const saved = readStorage(KEYS.TIMER, null);
          if (!saved?.habitId) return;
          const habit = this.habits.find(h => h.id === saved.habitId && !h.archived);
          if (!habit) { saveKey(KEYS.TIMER, null); return; }
          this.activeTimer = saved;
          if (this.activeTimer.isRunning && this.activeTimer.endTimestamp) {
            this.syncRunningTimerOnResume();
            if (this.activeTimer?.isRunning) this.attachTimerLoop();
          }
        },

        syncRunningTimerOnResume() {
          if (!this.activeTimer?.isRunning || !this.activeTimer.endTimestamp) return;
          const left = Math.ceil((this.activeTimer.endTimestamp - Date.now()) / 1000);
          if (left <= 0) {
            this.finishActiveTimer();
          } else {
            this.activeTimer.remainingSeconds = left;
            this.saveTimerState();
          }
        },

        finishActiveTimer() {
          if (!this.activeTimer) return;
          const h = this.habits.find(item => item.id === this.activeTimer.habitId);
          const mins = this.activeTimer.durationMinutes;
          const dKey = this.activeTimer.dateKey;
          this.closeMiniTimer();
          if (h) {
            const cur = this.getHabitVal(h, dKey);
            this.setHabitVal(h, dKey, cur + mins, true, '⏱ Hết giờ! Đã cộng +' + mins + ' phút cho ' + h.name, true);
          }
        },

        attachTimerLoop() {
          if (this.timerInterval) clearInterval(this.timerInterval);
          this.timerInterval = setInterval(() => {
            if (!this.activeTimer?.isRunning) return;
            const left = Math.ceil((this.activeTimer.endTimestamp - Date.now()) / 1000);
            if (left <= 0) this.finishActiveTimer();
            else this.activeTimer.remainingSeconds = left;
          }, 500);
        },

        toggleMiniTimer(habit) {
          if (this.activeTimer?.habitId === habit.id) {
            this.closeMiniTimer();
            return;
          }
          this.closeMiniTimer();
          const rem = this.getRemainingMins(habit);
          const defaultMins = Math.max(1, rem > 0 ? Math.min(habit.step, rem) : habit.step);
          this.activeTimer = {
            habitId: habit.id,
            dateKey: this.selectedDate,
            durationMinutes: defaultMins,
            remainingSeconds: defaultMins * 60,
            isRunning: false,
            endTimestamp: null
          };
          this.saveTimerState();
        },

        selectTimerMinutes(mins) {
          if (!this.activeTimer) return;
          const safe = Math.max(1, Math.round(mins));
          this.activeTimer.durationMinutes = safe;
          this.activeTimer.remainingSeconds = safe * 60;
          this.activeTimer.isRunning = false;
          this.activeTimer.endTimestamp = null;
          this.saveTimerState();
        },

        getTimerElapsedSeconds() {
          return this.activeTimer ? Math.max(0, this.activeTimer.durationMinutes * 60 - this.activeTimer.remainingSeconds) : 0;
        },

        getEarlyCommitMinutes() {
          return Math.max(1, Math.round(this.getTimerElapsedSeconds() / 60));
        },

        commitPartialTimer(habit) {
          if (this.activeTimer?.habitId !== habit.id || this.getTimerElapsedSeconds() < 1) return;
          const mins = this.getEarlyCommitMinutes();
          const dKey = this.activeTimer.dateKey;
          this.closeMiniTimer();
          const cur = this.getHabitVal(habit, dKey);
          this.setHabitVal(habit, dKey, cur + mins, true, '✓ Đã chốt sớm +' + mins + ' phút cho ' + habit.name, true);
        },

        startPauseTimer() {
          if (!this.activeTimer) return;
          if (this.activeTimer.isRunning) {
            if (this.timerInterval) clearInterval(this.timerInterval);
            this.timerInterval = null;
            this.activeTimer.remainingSeconds = Math.max(0, Math.ceil((this.activeTimer.endTimestamp - Date.now()) / 1000));
            this.activeTimer.isRunning = false;
            this.activeTimer.endTimestamp = null;
            this.saveTimerState();
          } else {
            this.activeTimer.isRunning = true;
            this.activeTimer.endTimestamp = Date.now() + this.activeTimer.remainingSeconds * 1000;
            this.saveTimerState();
            this.attachTimerLoop();
          }
        },

        resetTimer() {
          if (!this.activeTimer) return;
          if (this.timerInterval) clearInterval(this.timerInterval);
          this.timerInterval = null;
          this.activeTimer.remainingSeconds = this.activeTimer.durationMinutes * 60;
          this.activeTimer.isRunning = false;
          this.activeTimer.endTimestamp = null;
          this.saveTimerState();
        },

        closeMiniTimer() {
          if (this.timerInterval) clearInterval(this.timerInterval);
          this.timerInterval = null;
          this.activeTimer = null;
          saveKey(KEYS.TIMER, null);
        },

        formatTimerMMSS(sec) {
          const s = Math.max(0, Math.ceil(sec));
          return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
        },

        getTimerProgressPct() {
          if (!this.activeTimer) return 0;
          const total = Math.max(1, this.activeTimer.durationMinutes * 60);
          return Math.min(100, Math.round(((total - this.activeTimer.remainingSeconds) / total) * 100));
        },

        moveHabitInGroup(habitId, direction) {
          const target = this.habits.find(h => h.id === habitId);
          if (!target) return;
          const visibleList = this.getHabitsByGroup(target.timeOfDay, true);
          const curPos = visibleList.findIndex(h => h.id === habitId);
          const swapPos = curPos + direction;
          if (curPos === -1 || swapPos < 0 || swapPos >= visibleList.length) return;
          const idxA = this.habits.findIndex(h => h.id === visibleList[curPos].id);
          const idxB = this.habits.findIndex(h => h.id === visibleList[swapPos].id);
          if (idxA === -1 || idxB === -1) return;
          [this.habits[idxA], this.habits[idxB]] = [this.habits[idxB], this.habits[idxA]];
          this.habits = [...this.habits];
          saveKey(KEYS.HABITS, this.habits);
          this.bumpVersion();
          this.scheduleCloudSync();
        },

        changeWeek(dir) {
          this.weekOffset += dir;
          const days = this.weekDays;
          this.selectedDate = this.weekOffset === 0 ? this.todayKey : days[0].dateKey;
          if (this.activeTab === 'stats') this.statsAnimSeed++;
        },

        goToToday() {
          this.weekOffset = 0;
          this.selectedDate = this.todayKey;
        },

        jumpToDate(targetKey) {
          const todayMon = this.getMondayOfDate(this.parseDateKey(this.todayKey));
          const targetMon = this.getMondayOfDate(this.parseDateKey(targetKey));
          this.weekOffset = Math.round((targetMon.getTime() - todayMon.getTime()) / (7 * 86400000));
          this.selectedDate = targetKey;
          this.quickInputHabitId = null;
          this.switchTab('habits');
        },

        selectDate(key) {
          this.selectedDate = key;
          this.quickInputHabitId = null;
        },

        // ================= HABIT LOGIC & WEEKLY QUOTA =================
        isWeeklyTargetHabit(habit) {
          return habit.frequencyType === 'weekly_target' && (habit.weeklyTarget ?? 0) >= 1;
        },

        getWeeklyTargetGoal(habit) {
          return Math.min(6, Math.max(1, Number(habit.weeklyTarget) || 4));
        },

        getWeeklyDoneCount(habit, dateKey) {
          return this.memo('wDone:' + habit.id + ':' + dateKey, () => {
            const monday = this.getMondayOfDate(this.parseDateKey(dateKey));
            let count = 0;
            for (let i = 0; i < 7; i++) {
              if (this.isHabitCompleted(habit, this.formatDateKey(this.addDays(monday, i)))) count++;
            }
            return count;
          });
        },

        isWeeklyQuotaDone(habit, dateKey) {
          return this.isWeeklyTargetHabit(habit) && this.getWeeklyDoneCount(habit, dateKey) >= this.getWeeklyTargetGoal(habit);
        },

        isWeeklyQuotaSatisfiedOnOtherDays(habit, dateKey) {
          return this.isWeeklyTargetHabit(habit) && this.getHabitVal(habit, dateKey) === 0 && this.isWeeklyQuotaDone(habit, dateKey);
        },

        isHabitScheduled(habit, dateKey) {
          if (this.isWeeklyTargetHabit(habit)) return true;
          return habit.daysOfWeek.includes(this.getDayOfWeek1To7(this.parseDateKey(dateKey)));
        },

        isHabitApplicable(habit, dateKey) {
          const hasLog = (this.logs[dateKey]?.[habit.id] ?? 0) > 0;
          if (habit.createdAt && dateKey < habit.createdAt) return hasLog;
          if (habit.archived) {
            if (habit.archivedAt) {
              return dateKey < habit.archivedAt && this.isHabitScheduled(habit, dateKey);
            }
            return dateKey < this.todayKey && hasLog;
          }
          return this.isHabitScheduled(habit, dateKey);
        },

        getHabitsByGroup(groupKey, applyHideFilter = true) {
          const list = this.habits.filter(h => h.timeOfDay === groupKey && this.isHabitApplicable(h, this.selectedDate));
          if (applyHideFilter && this.hideCompleted) {
            return list.filter(h => !this.isHabitCompleted(h, this.selectedDate) && !this.isWeeklyQuotaSatisfiedOnOtherDays(h, this.selectedDate));
          }
          return list;
        },

        getGroupCompletedCount(groupKey) {
          return this.getHabitsByGroup(groupKey, false).filter(
            h => this.isHabitCompleted(h, this.selectedDate) || this.isWeeklyQuotaSatisfiedOnOtherDays(h, this.selectedDate)
          ).length;
        },

        isGroupCompleted(groupKey) {
          const all = this.getHabitsByGroup(groupKey, false);
          return all.length > 0 && this.getGroupCompletedCount(groupKey) === all.length;
        },

        getHabitVal(habit, dateKey) {
          return this.logs[dateKey]?.[habit.id] ?? 0;
        },

        isHabitCompleted(habit, dateKey) {
          return this.getHabitVal(habit, dateKey) >= habit.target;
        },

        setHabitVal(habit, dateKey, newVal, allowUndo = false, customMsg = null, isTimerFinish = false) {
          const prevVal = this.getHabitVal(habit, dateKey);
          const sanitized = Math.max(0, Math.round(newVal * 100) / 100);
          if (sanitized === prevVal) return;

          const prevPct = this.getDaySummary(dateKey).percentage;
          const wasDone = prevVal >= habit.target;
          const isNowDone = sanitized >= habit.target;

          if (sanitized > prevVal) {
            const diff = Math.round((sanitized - prevVal) * 100) / 100;
            this.spawnFloatingPop(habit.id, habit.mode === 'check' ? '+1 ✓' : ('+' + diff));
          }
          if (!wasDone && isNowDone) this.triggerCompletionPulse(habit.id);

          this.logs[dateKey] ??= {};
          this.logs[dateKey][habit.id] = sanitized;
          saveKey(KEYS.LOGS, this.logs);
          this.bumpVersion();
          this.scheduleCloudSync();

          const nextPct = this.getDaySummary(dateKey).percentage;
          const hit100 = prevPct < 100 && nextPct >= 100;
          const undoPayload = allowUndo ? { habitId: habit.id, dateKey, prevValue: prevVal } : null;

          if (hit100 || isTimerFinish || (!wasDone && isNowDone)) this.playSound('ting');
          else if (sanitized > prevVal) this.playSound('pop');

          if (hit100 && typeof confetti === 'function') {
            confetti({ particleCount: 75, spread: 68, origin: { y: 0.7 } });
            this.showToast('🎉 Tuyệt vời! Bạn đã hoàn thành 100% hôm nay!', 'success', undoPayload);
          } else if (allowUndo) {
            const msg = customMsg ?? (habit.mode === 'check'
              ? (sanitized >= habit.target ? 'Đã hoàn thành "' + habit.name + '"' : 'Đã bỏ đánh dấu "' + habit.name + '"')
              : (habit.name + ': ' + sanitized + '/' + habit.target + ' ' + habit.unit));
            this.showToast(msg, sanitized >= habit.target ? 'success' : 'default', undoPayload);
          }
        },

        toggleCheckHabit(habit) {
          const current = this.getHabitVal(habit, this.selectedDate);
          this.setHabitVal(habit, this.selectedDate, current >= habit.target ? 0 : habit.target, true);
        },

        incrementHabit(habit, delta) {
          const current = this.getHabitVal(habit, this.selectedDate);
          this.setHabitVal(habit, this.selectedDate, Math.max(0, current + delta), true);
        },

        openQuickInput(habit) {
          this.quickInputHabitId = habit.id;
          this.quickInputValue = this.getHabitVal(habit, this.selectedDate);
        },

        saveQuickInput(habit) {
          const val = Number(this.quickInputValue);
          if (!Number.isNaN(val) && val >= 0) this.setHabitVal(habit, this.selectedDate, val, true);
          this.quickInputHabitId = null;
        },

        getDaySummary(dateKey) {
          if (!dateKey) return { scheduledCount: 0, completedCount: 0, percentage: 0 };
          return this.memo('daySum:' + dateKey, () => {
            const scheduled = this.habits.filter(
              h => this.isHabitApplicable(h, dateKey) && !this.isWeeklyQuotaSatisfiedOnOtherDays(h, dateKey)
            );
            if (!scheduled.length) return { scheduledCount: 0, completedCount: 0, percentage: 0 };
            let completed = 0, ratioSum = 0;
            scheduled.forEach(h => {
              const r = Math.min(1, Math.max(0, this.getHabitVal(h, dateKey) / h.target));
              ratioSum += r;
              if (r >= 1) completed++;
            });
            return {
              scheduledCount: scheduled.length,
              completedCount: completed,
              percentage: Math.round((ratioSum / scheduled.length) * 100)
            };
          });
        },

        getSmartCoachMessage(dateKey) {
          if (this.isRestDay(dateKey)) return '⛱️ Đang bật Ngày nghỉ — Chuỗi ngày của bạn được bảo vệ an toàn hôm nay.';
          const sum = this.getDaySummary(dateKey);
          if (sum.scheduledCount === 0) return 'Không có thói quen nào cần thực hiện thêm trong ngày này.';
          if (sum.percentage >= 100) return 'Chúc mừng! Bạn đã hoàn thành trọn vẹn 100% mục tiêu hôm nay.';

          const applicable = this.habits.filter(
            h => this.isHabitApplicable(h, dateKey) && !this.isWeeklyQuotaSatisfiedOnOtherDays(h, dateKey)
          );
          const slotOrder = {
            morning: ['morning', 'day', 'evening'],
            day: ['day', 'morning', 'evening'],
            evening: ['evening', 'day', 'morning']
          };
          const orderedSlots = dateKey === this.todayKey ? (slotOrder[this.currentTimeOfDay] ?? ['morning', 'day', 'evening']) : ['morning', 'day', 'evening'];

          if (dateKey === this.todayKey && sum.percentage === 0) {
            const greetings = {
              morning: 'Chào buổi sáng! Bắt đầu ngày mới với ',
              day: 'Chào buổi trưa! Khởi động năng lượng với ',
              evening: 'Chào buổi tối! Bắt đầu thư giãn với '
            };
            let firstHabit = null;
            for (const slot of orderedSlots) {
              firstHabit = applicable.find(h => h.timeOfDay === slot);
              if (firstHabit) break;
            }
            firstHabit ??= applicable[0];
            return (greetings[this.currentTimeOfDay] ?? 'Bắt đầu hôm nay với ') + firstHabit.name + ' nhé.';
          }

          let pool = [];
          for (const slot of orderedSlots) {
            const inc = applicable.filter(h => h.timeOfDay === slot && !this.isHabitCompleted(h, dateKey));
            if (inc.length) { pool = inc; break; }
          }
          if (!pool.length) pool = applicable.filter(h => !this.isHabitCompleted(h, dateKey));

          const closest = pool
            .map(h => {
              const val = this.getHabitVal(h, dateKey);
              return { habit: h, ratio: Math.min(1, Math.max(0, val / h.target)), remaining: Math.max(0, Math.round((h.target - val) * 100) / 100) };
            })
            .sort((a, b) => b.ratio - a.ratio)[0];

          if (!closest) return 'Tiếp tục duy trì thói quen đều đặn nhé!';
          const label = closest.habit.mode === 'counter'
            ? (closest.remaining + ' ' + closest.habit.unit + ' ' + closest.habit.name)
            : closest.habit.name;

          if (sum.percentage >= 80) return 'Đã an toàn giữ chuỗi! Chỉ còn ' + label + ' nữa là chạm mốc 100%.';
          return closest.habit.mode === 'counter'
            ? ('Còn thiếu ' + label + ' nữa — cố lên để chạm mốc 80% giữ chuỗi!')
            : ('Hoàn thành "' + closest.habit.name + '" nữa — cố lên để chạm mốc 80% giữ chuỗi!');
        },

        isDayEligibleForStats(day) {
          if (day.dateKey > this.todayKey || this.isRestDay(day.dateKey)) return false;
          if (day.dateKey === this.todayKey && day.pct === 0) return false;
          return true;
        },

        getHabitStreak(habit) {
          return this.memo('hStreak:' + habit.id + ':' + this.todayKey, () => {
            let streak = 0;
            const ref = this.parseDateKey(this.todayKey);
            const refMonKey = this.formatDateKey(this.getMondayOfDate(ref));
            const refDow = this.getDayOfWeek1To7(ref);
            for (let i = 0; i < 365; i++) {
              const d = this.addDays(ref, -i);
              const key = this.formatDateKey(d);
              if (habit.createdAt && key < habit.createdAt && (this.logs[key]?.[habit.id] ?? 0) === 0) break;
              if (!this.isHabitScheduled(habit, key)) continue;
              if (this.isHabitCompleted(habit, key)) { streak++; continue; }
              if (this.isRestDay(key)) continue;
              if (this.isWeeklyTargetHabit(habit)) {
                const doneInW = this.getWeeklyDoneCount(habit, key);
                const goalW = this.getWeeklyTargetGoal(habit);
                if (doneInW >= goalW) continue;
                if (this.formatDateKey(this.getMondayOfDate(d)) === refMonKey && doneInW + (7 - refDow + 1) >= goalW) continue;
              }
              if (i === 0) continue;
              break;
            }
            return streak;
          });
        },

        // ================= FORM, MODAL & .ICS EXPORT =================
        setFormTimeOfDay(key) {
          this.form.timeOfDay = key;
          if (!this.editingHabitId) this.form.reminderTime = this.getDefaultReminderTime(key);
        },

        applyQuickPreset(preset) {
          this.form = {
            ...preset,
            frequencyType: 'days',
            weeklyTarget: 4,
            daysOfWeek: [1,2,3,4,5,6,7],
            reminderTime: this.getDefaultReminderTime(preset.timeOfDay)
          };
          this.playSound('pop');
        },

        openAddModal() {
          this.editingHabitId = null;
          this.sheetDragY = 0;
          this.form = {
            name: '', timeOfDay: this.currentTimeOfDay, mode: 'counter', target: 10, step: 5, unit: 'phút',
            icon: '🎯', color: 'indigo', frequencyType: 'days', weeklyTarget: 4,
            daysOfWeek: [1,2,3,4,5,6,7], reminderTime: this.getDefaultReminderTime(this.currentTimeOfDay)
          };
          this.sheetOpen = true;
        },

        openEditModal(habit) {
          this.editingHabitId = habit.id;
          this.sheetDragY = 0;
          const copy = cloneData(habit);
          copy.frequencyType ??= 'days';
          copy.weeklyTarget ??= 4;
          copy.reminderTime ??= this.getDefaultReminderTime(copy.timeOfDay ?? 'morning');
          this.form = copy;
          this.sheetOpen = true;
        },

        downloadHabitIcs() {
          const titleName = (this.form.name ?? '').trim() || 'Thói quen HabitFlow';
          const [hStr, mStr] = (this.form.reminderTime || '07:00').split(':');
          const hh = Math.min(23, Math.max(0, Number(hStr) || 7));
          const mm = Math.min(59, Math.max(0, Number(mStr) || 0));

          const now = new Date();
          const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0);
          const end = new Date(start.getTime() + 15 * 60000);
          const fmtIcs = (dt) =>
            dt.getFullYear() +
            String(dt.getMonth() + 1).padStart(2, '0') +
            String(dt.getDate()).padStart(2, '0') +
            'T' +
            String(dt.getHours()).padStart(2, '0') +
            String(dt.getMinutes()).padStart(2, '0') +
            '00';

          const dtStart = fmtIcs(start);
          const dtEnd = fmtIcs(end);

          const dayMap = { 1: 'MO', 2: 'TU', 3: 'WE', 4: 'TH', 5: 'FR', 6: 'SA', 7: 'SU' };
          let rrule = 'RRULE:FREQ=DAILY';
          if (this.form.frequencyType !== 'weekly_target' && this.form.daysOfWeek?.length > 0 && this.form.daysOfWeek.length < 7) {
            const byDay = this.form.daysOfWeek.map(v => dayMap[v]).filter(Boolean).join(',');
            if (byDay) rrule = 'RRULE:FREQ=WEEKLY;BYDAY=' + byDay;
          }

          const goalText = this.form.mode === 'counter' ? ('Mục tiêu: ' + this.form.target + ' ' + this.form.unit) : 'Mục tiêu: Hoàn thành trong ngày';
          const freqText = this.form.frequencyType === 'weekly_target' ? (' (' + this.form.weeklyTarget + ' buổi/tuần)') : '';

          const lines = [
            'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//HabitFlow//iOS PWA Habit Tracker//VI',
            'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'BEGIN:VEVENT',
            'UID:habitflow-' + Date.now() + '@habitflow.app',
            'DTSTAMP:' + dtStart, 'DTSTART:' + dtStart, 'DTEND:' + dtEnd, rrule,
            'SUMMARY:' + this.form.icon + ' ' + titleName + ' — HabitFlow',
            'DESCRIPTION:Nhắc nhở thực hiện thói quen "' + titleName + '". ' + goalText + freqText + '.',
            'BEGIN:VALARM', 'TRIGGER:-PT0M', 'ACTION:DISPLAY',
            'DESCRIPTION:' + this.form.icon + ' Đến giờ thực hiện: ' + titleName,
            'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'
          ];

          const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'habitflow-reminder.ics';
          a.click();
          URL.revokeObjectURL(url);
          this.showToast('🔔 Đã tải lịch nhắc (' + (this.form.reminderTime || '07:00') + ') cho Lịch iPhone!', 'success');
        },

        toggleFormDay(dayVal) {
          const idx = this.form.daysOfWeek.indexOf(dayVal);
          if (idx > -1) {
            if (this.form.daysOfWeek.length > 1) this.form.daysOfWeek.splice(idx, 1);
          } else {
            this.form.daysOfWeek.push(dayVal);
            this.form.daysOfWeek.sort();
          }
        },

        saveHabitForm() {
          if (!this.form.name.trim()) {
            this.showToast('Vui lòng nhập tên thói quen.', 'error');
            return;
          }
          const isWeekly = this.form.frequencyType === 'weekly_target';
          const existing = this.editingHabitId ? this.habits.find(h => h.id === this.editingHabitId) : null;
          const payload = {
            id: this.editingHabitId || ('h-' + Date.now()),
            name: this.form.name.trim(),
            timeOfDay: this.form.timeOfDay,
            mode: this.form.mode,
            target: this.form.mode === 'check' ? 1 : Math.max(1, Number(this.form.target) || 1),
            step: this.form.mode === 'check' ? 1 : Math.max(1, Number(this.form.step) || 1),
            unit: this.form.mode === 'check' ? 'lần' : (this.form.unit.trim() || 'lần'),
            icon: this.form.icon,
            color: this.form.color,
            frequencyType: isWeekly ? 'weekly_target' : 'days',
            weeklyTarget: Math.min(6, Math.max(1, Number(this.form.weeklyTarget) || 4)),
            daysOfWeek: isWeekly ? [1,2,3,4,5,6,7] : (this.form.daysOfWeek.length ? this.form.daysOfWeek : [1,2,3,4,5,6,7]),
            reminderTime: this.form.reminderTime || '07:00',
            createdAt: existing ? existing.createdAt : this.todayKey,
            archived: false
          };
          if (this.editingHabitId) {
            const idx = this.habits.findIndex(h => h.id === this.editingHabitId);
            if (idx > -1) this.habits[idx] = payload;
            this.showToast('Đã lưu thay đổi thói quen.', 'success');
          } else {
            this.habits.push(payload);
            this.showToast('Đã thêm thói quen mới.', 'success');
          }
          saveKey(KEYS.HABITS, this.habits);
          this.bumpVersion();
          this.scheduleCloudSync();
          this.sheetOpen = false;
        },

        archiveCurrentHabit() {
          if (!this.editingHabitId) return;
          const h = this.habits.find(item => item.id === this.editingHabitId);
          if (h) { h.archived = true; h.archivedAt = this.todayKey; }
          if (this.activeTimer?.habitId === this.editingHabitId) this.closeMiniTimer();
          saveKey(KEYS.HABITS, this.habits);
          this.bumpVersion();
          this.scheduleCloudSync();
          this.sheetOpen = false;
          this.showToast('Đã tạm ẩn (lưu trữ) từ hôm nay. Thống kê các ngày trước vẫn bảo toàn.');
        },

        restoreArchivedHabit(id) {
          const h = this.habits.find(item => item.id === id);
          if (h) { h.archived = false; delete h.archivedAt; }
          saveKey(KEYS.HABITS, this.habits);
          this.bumpVersion();
          this.scheduleCloudSync();
          this.showToast('Đã khôi phục thói quen trở lại danh sách.', 'success');
        },

        // ================= MODAL XÁC NHẬN DÙNG CHUNG =================
        openConfirm(action, payload = null) {
          if (action === 'delete_habit') {
            this.confirmDialog = {
              open: true, action, payload, step: 1, tone: 'rose',
              title: 'Xóa vĩnh viễn thói quen này?',
              message: 'Nếu muốn giữ tỷ lệ thống kê quá khứ, hãy chọn Tạm ẩn (Lưu trữ) thay vì xóa cứng.',
              confirmLabel: 'Xác nhận xóa'
            };
          } else if (action === 'delete_archived') {
            this.confirmDialog = {
              open: true, action, payload, step: 1, tone: 'rose',
              title: 'Xóa vĩnh viễn khỏi lưu trữ?',
              message: 'Thao tác này không thể hoàn tác.',
              confirmLabel: 'Xóa ngay'
            };
          } else if (action === 'reset_defaults') {
            this.confirmDialog = {
              open: true, action, payload, step: 1, tone: 'amber',
              title: 'Khôi phục 6 thói quen mẫu?',
              message: 'Danh sách sẽ đặt lại về 6 thói quen mặc định. Toàn bộ lịch sử tiến độ cũ vẫn được giữ nguyên.',
              confirmLabel: 'Khôi phục'
            };
          } else if (action === 'clear_history') {
            this.confirmDialog = {
              open: true, action, payload, step: 1, tone: 'rose',
              title: 'Bước 1/2: Xóa toàn bộ lịch sử?',
              message: 'Tất cả lịch sử tiến độ, chuỗi streak, ngày nghỉ và nhật ký sẽ bị xóa sạch (thói quen vẫn giữ nguyên).',
              confirmLabel: 'Tiếp tục (1/2)'
            };
          }
        },

        closeConfirm() {
          this.confirmDialog.open = false;
        },

        proceedConfirm() {
          const { action, payload, step } = this.confirmDialog;
          if (action === 'delete_habit') {
            if (this.editingHabitId) {
              this.habits = this.habits.filter(h => h.id !== this.editingHabitId);
              if (this.activeTimer?.habitId === this.editingHabitId) this.closeMiniTimer();
              saveKey(KEYS.HABITS, this.habits);
              this.bumpVersion();
              this.scheduleCloudSync();
              this.sheetOpen = false;
              this.showToast('Đã xóa thói quen.');
            }
            this.closeConfirm();
          } else if (action === 'delete_archived') {
            this.habits = this.habits.filter(h => h.id !== payload);
            saveKey(KEYS.HABITS, this.habits);
            this.bumpVersion();
            this.scheduleCloudSync();
            this.showToast('Đã xóa vĩnh viễn thói quen lưu trữ.');
            this.closeConfirm();
          } else if (action === 'reset_defaults') {
            this.habits = cloneData(DEFAULT_HABITS);
            saveKey(KEYS.HABITS, this.habits);
            this.bumpVersion();
            this.scheduleCloudSync();
            this.showToast('Đã khôi phục 6 thói quen mặc định (giữ nguyên lịch sử cũ).', 'success');
            this.closeConfirm();
          } else if (action === 'clear_history') {
            if (step === 1) {
              this.confirmDialog.step = 2;
              this.confirmDialog.title = 'Bước 2/2: Chắc chắn xóa trắng?';
              this.confirmDialog.message = 'Xác nhận lần cuối: Toàn bộ lịch sử sẽ mất vĩnh viễn nếu bạn chưa xuất file sao lưu .json.';
              this.confirmDialog.confirmLabel = 'Xóa sạch ngay';
            } else {
              this.logs = {};
              this.notes = {};
              this.restDays = {};
              this.moods = {};
              saveKey(KEYS.LOGS, {});
              saveKey(KEYS.NOTES, {});
              saveKey(KEYS.REST_DAYS, {});
              saveKey(KEYS.MOODS, {});
              this.bumpVersion();
              this.scheduleCloudSync();
              this.closeConfirm();
              this.showToast('Đã xóa toàn bộ lịch sử tiến độ, ngày nghỉ và nhật ký.');
            }
          }
        },

        // ================= WEB SHARE API & COPY JSON =================
        buildBackupPayload() {
          return JSON.stringify({
            app: 'HabitFlow',
            version: '6.0.0',
            exportedAt: new Date().toISOString(),
            habits: this.habits,
            logs: this.logs,
            notes: this.notes,
            restDays: this.restDays,
            moods: this.moods
          }, null, 2);
        },

        async exportBackupJson() {
          const jsonStr = this.buildBackupPayload();
          const fileName = 'habitflow-backup-' + this.todayKey + '.json';
          try {
            if (typeof File === 'function' && navigator.canShare) {
              const file = new File([jsonStr], fileName, { type: 'application/json' });
              if (navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'Sao lưu HabitFlow' });
                this.showToast('Đã chia sẻ file sao lưu (.json) thành công!', 'success');
                return;
              }
            }
          } catch (err) {
            if (err?.name === 'AbortError') return;
          }
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          a.click();
          URL.revokeObjectURL(url);
          this.showToast('Đã xuất file sao lưu (.json) thành công!', 'success');
        },

        async copyBackupJson() {
          try {
            await navigator.clipboard.writeText(this.buildBackupPayload());
            this.showToast('📋 Đã sao chép mã JSON vào bộ nhớ tạm!', 'success');
          } catch {
            this.showToast('Không thể copy tự động, hãy dùng nút Chia sẻ / Tải (.json).', 'error');
          }
        },

        importBackupJson(event) {
          const file = event.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const parsed = JSON.parse(e.target.result);
              if (Array.isArray(parsed.habits) && typeof parsed.logs === 'object' && parsed.logs !== null) {
                this.habits = parsed.habits;
                this.logs = parsed.logs;
                if (parsed.notes && typeof parsed.notes === 'object') this.notes = parsed.notes;
                if (parsed.restDays && typeof parsed.restDays === 'object') this.restDays = parsed.restDays;
                if (parsed.moods && typeof parsed.moods === 'object') this.moods = parsed.moods;
                saveKey(KEYS.HABITS, this.habits);
                saveKey(KEYS.LOGS, this.logs);
                saveKey(KEYS.NOTES, this.notes);
                saveKey(KEYS.REST_DAYS, this.restDays);
                saveKey(KEYS.MOODS, this.moods);
                this.bumpVersion();
                this.scheduleCloudSync();
                this.showToast('Khôi phục thành công ' + parsed.habits.length + ' thói quen từ file!', 'success');
              } else {
                this.showToast('File sao lưu không đúng cấu trúc HabitFlow.', 'error');
              }
            } catch {
              this.showToast('Lỗi đọc file: File JSON bị hỏng hoặc sai định dạng.', 'error');
            } finally {
              event.target.value = '';
            }
          };
          reader.onerror = () => {
            this.showToast('Không thể đọc tệp sao lưu.', 'error');
            event.target.value = '';
          };
          reader.readAsText(file);
        }
      };
    }
  </script>
